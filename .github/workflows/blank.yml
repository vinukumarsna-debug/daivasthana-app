name: Build Daivasthana APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q DaivasthanaApp_Android_Project.zip -d project

      - name: Find project folder
        run: |
          if [ -f project/settings.gradle ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            DIR=$(find project -name settings.gradle -print -quit | xargs dirname)
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daivasthana-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
